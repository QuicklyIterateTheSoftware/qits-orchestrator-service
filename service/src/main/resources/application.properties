# The application config for qits-orchestrator as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# `orchestrator` ships DEFAULTS it does not own the deployment of. Its datasource, persistence unit,
# Flyway lineage, peer urls, gc policy and the oidc client blocks stay there; what a deployment
# supplies is the platform's generic resource triple, which those defaults expand:
#
#     QITS_RESOURCE_DB_URL / QITS_RESOURCE_DB_USERNAME / QITS_RESOURCE_DB_PASSWORD
#
# injected by qits-platform-deployments from the `resources: postgresql:db` line in
# .config/qits/deployments.yml. Any key is still overridable by env on top of that.
#
# The tests read this file too — Quarkus merges src/test/resources/application.properties OVER it
# rather than replacing it — so everything below is in effect during the suite. That is deliberate:
# a test copy of an app-level key is free to drift from the shipped one, and then a green suite
# proves nothing about what actually starts.

# The deployed identity, and — because Quarkus feeds this key straight into the OpenTelemetry resource
# as `service.name` — the name this service's telemetry is filed under at qits-observability. The two
# are the same string on purpose: the only name a person has to know in order to find this process is
# the one they used to address it.
#
# It reads `qits-orchestrator` and not `qits-platform-orchestrator` because the platform plane is gone.
# There is no second class of service for `platform` to distinguish any more, the wire alias, the
# container name and the image coordinate all moved, and a word that no longer means anything left in
# the one place observability reads is worse than one that never existed:
# `_service/qits-platform-orchestrator` is a stream nobody will think to open.
#
# CHANGING THIS SPLITS THE TELEMETRY, and the size of that split was measured rather than assumed,
# because the obvious fear — that a long history forks in two — is not what happens here. The
# receiver, qits-observability, OWNS NO TABLES AND NO DATASOURCE. Its TelemetryStore is a
# ConcurrentHashMap of ring buffers whose key comes from the decoded service.name attribute
# (`_service/<name>`, in keyFor), bounded only by counts and bytes rather than by age:
# max-spans-per-workspace, max-logs-per-workspace, max-metric-series-per-workspace,
# max-bytes-per-source, max-total-bytes. There is NO retention policy, no TTL and no purge job, and
# nothing on that side names a service at all — no source table, no dashboard, no alert rule, no
# saved query. The SPA's lens is URL query state and is not stored either. So nothing DURABLE keys
# on service.name, and there is nothing to migrate.
#
# The change therefore costs minutes, not history. The old bucket stops filling, drains as its
# records are evicted, and disappears entirely the next time qits-observability restarts — and
# sources() keeps an emptied bucket listed with zero counts on purpose, so for a while both names
# appear side by side, which is the only genuinely confusing artefact. One real shape effect on top
# of that: a trace that straddles the rollover has its spans in two buckets, so the trace view draws
# a partial tree under each, and that lasts one deploy. It bites hardest here, because the trace of
# a gc run — one process fanning out over eight peers — is the artefact this service's telemetry
# exists for, and a run that straddles the cutover is two partial traces under two names. What
# outlives the rollover is only copied links. A bookmarked
# `?source=_service/qits-platform-orchestrator`, or a `qits observe` filter spelling the old name,
# answers EMPTY rather than erroring — which draws as "no telemetry". Re-issue it with the new name;
# there is no alias on the receiving side and nowhere to put one that would survive a restart
# anyway.
#
# Set against a cost measured in minutes, leaving the old name in place is the permanent version of
# the same failure: `_service/qits-orchestrator` — the only name anything on this estate answers on
# now — would return nothing forever, and on this platform nothing is indistinguishable from no
# errors. A silence that looks like health is the failure to avoid, so the overlap is paid once.
quarkus.application.name=qits-orchestrator

# The JAX-RS prefix every qits route lives under: /<segment>/api, where the segment is this
# service's name without the qits- prefix. It read "without the qits-platform- prefix" until the
# plane was deleted, and the segment did NOT move when the name did — which is the point worth
# keeping: the prefix was never part of the routing, only part of the name it was stripped from.
# qits-gateway routes VERBATIM by prefix — /orchestrator/* reaches this service with the path
# untouched — so the leading segment is not decoration, it is the difference between being reachable
# through the gateway and not being reachable at all.
quarkus.rest.path=/orchestrator/api

# Quarkus' non-application root path: what the framework serves rather than application code (the
# OpenAPI document, swagger-ui, health). It sits OUTSIDE quarkus.rest.path and moves only via this
# key, so without it /q/* stays at the root — where a prefix-routing gateway cannot reach it. The
# readiness probe qits-platform-deployments' health gate curls is /orchestrator/q/health/ready, and
# it is this key that puts it there.
quarkus.http.non-application-root-path=/orchestrator/q

# --- the client ---------------------------------------------------------------------------------
# Quinoa builds src/main/webui (the qits-platform-spa-orchestrator submodule, an Angular SPA) during
# augmentation and serves the output as static resources.
#
# THE CLIENT IS SERVED AT THE ROOT, because this service has a host of its own —
# orchestrator.<env>.<domain>. The API keeps its segment (/orchestrator/api) and is path-routed on
# every host, so the client's own same-origin calls are unchanged; what moved is only where the page
# itself lives.
#
# ui-root-path is now `/` and the client's angular.json says baseHref "/", so the two still agree —
# Quinoa mounts the files, the baseHref is what makes index.html ask for them at the right url, and a
# mismatch serves a page whose every asset 404s with nothing on this side to notice.
# PackagedSurfaceIT asserts the base href for exactly that reason.
quarkus.quinoa.ui-root-path=/

# Deep links. The client's own routes — /processes/gc and the run beneath it — have no file behind
# them, so without this a reload or a pasted link 404s and only the entry page works. An operator
# shares a run's address with somebody; this is what makes that address work.
quarkus.quinoa.enable-spa-routing=true

# Angular's output. Quinoa can derive this from the client's angular.json, but it derives it from a
# project NAME — pinning it means a rename over there fails this build ("Quinoa build directory not
# found") rather than resolving somewhere stale.
quarkus.quinoa.build-dir=dist/qits-platform-spa-orchestrator/browser

# WHAT THE SPA FALLBACK MUST NOT SWALLOW.
#
# The fallback is a late-order catch-all: anything with a real route in front of it still wins, but a
# request matching NO route is rerouted to index.html and answers 200 text/html. The stake here is
# the client's own polling — GET /orchestrator/api/runs/<id> every two seconds while a run is
# RUNNING — and a mistyped or half-deployed path answering a PAGE would hand a JSON parser an HTML
# document. The correct answer to a mistyped machine path is a 404, and this key is the whole of
# what keeps it one.
#
# THE VALUE IS ABSOLUTE NOW. Entries are matched after ui-root-path is stripped, and the ui root is
# `/`, so nothing is stripped and every entry is the real path. The old relative spelling would name
# nothing.
#
# ONE ENTRY IS THE WHOLE LIST, because matching is by path SEGMENT: /orchestrator covers
# /orchestrator/api (quarkus.rest.path) and /orchestrator/q (quarkus.http.non-application-root-path)
# alike. It protects a segment and not a string prefix, so /orchestrator-nope is not covered by it
# and answers the page — which is right, that path belongs to nothing here.
#
# The segment is spelled in three keys of this file — quarkus.rest.path,
# quarkus.http.non-application-root-path and this one — plus `routes:` in .config/qits/deployments.yml.
# The client no longer spells it at all. Add a literal route outside the segment and its entry here
# IN THE SAME COMMIT.
quarkus.quinoa.ignored-path-prefixes=/orchestrator

# quarkus.quinoa.package-manager-install is deliberately NOT here. A local or CI mvnw build uses the
# node on PATH, so no build silently downloads a toolchain; the two install flags appear only in
# docker/Dockerfile's builder stage, which ships no node at all.
#
# Quinoa is also disabled by default in TEST mode and is left that way. A @QuarkusTest asserting
# anything about / would pass against a process with no client in it, so what the SPA is actually
# served as is proved against the packaged artifact and nowhere else — PackagedSurfaceIT.

# --- the API document ---------------------------------------------------------------------------
# Served at /orchestrator/q/openapi, with the browsable UI at /orchestrator/q/swagger-ui — both
# under quarkus.http.non-application-root-path above, not quarkus.rest.path.
quarkus.smallrye-openapi.info-title=qits-platform-orchestrator API
quarkus.swagger-ui.always-include=true

# --- identity -----------------------------------------------------------------------------------
# TWO TRACKS OF IDENTITY REACH THIS SERVICE AND THEY DO NOT REPLACE EACH OTHER. A request with no
# Authorization header is USER traffic: qits-gateway performed the login and asserted X-Qits-User /
# X-Qits-Roles, and qits-auth-core's ForwardAuthMechanism reads them. A request WITH a bearer is
# MACHINE traffic: quarkus-oidc validates the token against qits-idp.
#
# BOTH LAND AS ROLES, which is why every route here is @RolesAllowed and none of them calls
# MachineAuth.require(). An operator presses Run now in a browser; a machine may post the same run.
# `qits:system` is the machine role and `qits:admin` the human one; every route accepts the pair.
# Every GET also accepts `qits:agent`, a commissioned agent's role; no write does.
#
# THE WRITE SURFACE STARTS DELETIONS ON FOUR OTHER SERVICES. There is no anonymous route here and
# there must never be one.
#
# WHICH TOKENS ARE OURS IS NOT STATED HERE. qits-auth-core's MachineAuth reads it from its own
# shipped `qits.auth.machine.platform-audience`, qits-platform — the platform's ONE audience, not a
# name of this service's own: qits-idp puts `qits-platform` on every token it mints, so that IS which
# tokens are ours. A deployment setting `QITS_AUTH_MACHINE_AUDIENCE` sets nothing.

# THE ROLLOUT GATE IS OFF (qits.auth.machine.required, defaulted false by qits-auth-core), and
# VALIDATION FOLLOWS THAT GATE rather than standing on its own. Gate off, there is no OIDC tenant,
# nothing fetches a JWKS, nothing waits on a host named qits-idp, and a clone-alone
# `./mvnw verify` needs no issuer at all. There is no third state — either the gate and the
# validation are both on, or both off.
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}

# Bearer-only: this service starts no login flow and holds no session — the gateway does both.
#
# THE HOST IS DERIVED FROM THE ENVIRONMENT RATHER THAN CONFIGURED. Every application on qits-net
# answers at `<environment>-<application>`, unconditionally and for every service there is, and
# qits-deployments injects QITS_ENVIRONMENT into every container it starts — so an `<env>-<alias>`
# address plus a fixed path is not a decision a deployment makes, it is a SPELLING this process
# already holds both halves of. The application is qits-idp (it was qits-platform-idp until the
# platform tier went), so its alias is dev-qits-idp. `dev` is the fallback because this estate's
# environment is dev, the same assumption every other default in this file makes.
#
# IT DOES NOT TAKE EFFECT WHILE A DEPLOYMENT STILL CARRIES THE ENTRY. QUARKUS_OIDC_AUTH_SERVER_URL
# reaches the process as an environment variable at ordinal 300 and this file is 250, so a live entry
# outranks the derivation for as long as it exists; deleting that entry is its own later step.
quarkus.oidc.auth-server-url=http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp
quarkus.oidc.application-type=service

# Discovery OFF, path given. The issuer string is a public URL while the fetch happens internally on
# the platform's own networks, so a discovery document fetched from the issuer would name addresses
# this process cannot reach. The path is JOINED onto auth-server-url, so it is `jwks`, not
# `/idp/jwks`.
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks

# ONE AUDIENCE, AND IT IS THE PLATFORM'S. qits-idp puts `qits-platform` on every token it mints,
# whatever the client asked for, so a peer's machine bearer and a person's `qits` CLI token both
# address this service by that one name; what a caller may do here is decided by its roles, never by
# the audience it was addressed with. Spelled as a LITERAL rather than as
# ${qits.auth.machine.platform-audience}: that key is the library's gate contract and this one is the
# OIDC tenant's, and a tenant reading the library's key would follow an environment override of it
# into refusing every token the platform actually mints.
quarkus.oidc.token.audience=qits-platform

# AN UNREACHABLE IDP DOES NOT STOP THIS SERVICE. connection-delay turns the single boot attempt into
# a retried one — 30S is fifteen tries, two seconds apart, which covers idp coming up beside this
# service on a cold boot. When the window expires a WARN is logged and startup continues. Readiness
# deliberately stays independent of idp: the deployer health-gates this service, and tying its
# readiness to another service's would make a cold boot a question of ordering.
quarkus.oidc.connection-delay=30S
# And how fast a ROTATED idp key is picked up. An unknown `kid` buys ONE JWKS refresh, and the
# default 10M is the minimum before the next — so one attempt landing while idp is mid-cutover would
# mean ten minutes of 401s. PT5S ends it seconds after idp answers.
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# --- telemetry ----------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path, the same shape
# as the eight qits.orchestrator.targets.<name>-url peer urls the `orchestrator` jar ships. The
# ingest path is qits-observability's own and belongs to the service, not to the deployment, so it is
# spelled once here and derived rather than configured. Point this at a collector or a different host
# and everything below follows.
#
# THE HOST IS DERIVED NOW TOO, AND IT IS THE SAME ARGUMENT ONE STEP FURTHER. The path was already
# qits-observability's own fact rather than a deployment's; the ALIAS is the same kind of fact,
# because every application on qits-net answers at `<environment>-<application>` and
# qits-deployments injects QITS_ENVIRONMENT into every container it starts — so the receiver's
# address is something this process works out rather than something an entry has to carry.
# qits-observability is not one of the nine platform applications, so the alias is dev-qits-observability
# on this estate; the fallback is `dev` for the reason the tenant's block above gives.
#
# A deployment still overrides this by env as QITS_OBSERVABILITY_URL, at ordinal 300 above this
# file's 250 — which is what the platform's compose template set before this derivation existed, and
# deleting that entry is its own later step, exactly as with the oidc tenant's auth-server-url above.
qits.observability.url=http://${QITS_ENVIRONMENT:dev}-qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is qits-observability's OtelReceiverResource over
# HTTP, and the exporter appends /v1/<signal> to this base — so this resolves to the three ingest
# routes at /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# The source key on the far side follows quarkus.application.name (qits-orchestrator, at the top of
# this file). It is the deployed identity, not the repository name, and moving it moves this service's
# telemetry to a stream nobody is looking at — which is exactly what it was doing while it still read
# qits-platform-orchestrator, since that address no longer exists anywhere else on the estate. Read the
# paragraph on that key before touching it: a change here is not free, it splits the live stream in two for a rollover.
#
# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists. A gc run is one process
# fanning out over eight peers, so the trace is the first place the shape of a run is visible without
# opening the run store.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop this service's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit — what this
# service says at INFO is the account of a run (GcSchedule and GcDeployTrigger starting one, the
# executor's one line per finished run), while GcDeployTrigger's per-event debounce bookkeeping is
# DEBUG and the per-step peer calls are recorded in the run store rather than logged at all. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# That an ordinary logger call really becomes an exported OTLP record is proven once, in qits-events:
# its OtelLogBridgeTest decodes a real ExportLogsServiceRequest and PackagedLogBridgeIT repeats the
# claim against the packaged artifact. The same extension and the same four keys run here, so this
# repo guards the configuration rather than re-proving the behaviour — telemetry/OtelLogConfigTest
# pins these values so drift cannot disable log export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment, for the same reason the event bus below is. A clone-alone `./mvnw
# verify` and a `quarkus:dev` have no qits-observability to reach, and an exporter retrying against
# an unresolvable host turns every suite into a wall of export failures. The deployment is where
# telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# --- the platform event bus ---------------------------------------------------------------------
# This service LISTENS and publishes nothing. bus/DeploymentActiveListener consumes qits-deployments'
# DeploymentActive durably and hands each one to schedule/GcDeployTrigger, which collapses a
# deployment wave into one gc run a quiet period after the last event. The cron is the backstop.
#
# NOTHING THE BUS NEEDS IS SPELLED HERE, deliberately. qits.events.url, the outbox's own datasource
# and Flyway lineage, the publish timeout, the retry budget, the redial backoff and the catch-up
# schedule all ship as ordinal-100 defaults in the qits-eventstream jar — the same way `orchestrator`
# ships its own — and a copy in this file would be a second place to change and a silent way for the
# two to drift. A deployment overrides them by environment.
#
# What DOES belong here is the darkness, because the library ships enabled: a library that shipped
# dark would be one whose first deployment discovers it was never wired up, and the deployable is
# what owns where it is real. Same policy as the peers' oidc clients above — a clone-alone
# `./mvnw verify` and a `quarkus:dev` have no qits-events on the far side, and enabled, the
# subscriber would redial a stream nobody serves while the sweeper paged a log that is not there.
#
# DARK IS NOT ABSENT. It stops publishing, sweeping and dialling; it does not stop the DATASOURCE.
# Quarkus opens the connection and runs Flyway at boot regardless, which is why this application
# declares a SECOND resource in .config/qits/deployments.yml and why the suite hands out a second
# database (testdb/EmbeddedPgConfigSource) and PackagedSurfaceIT a second QITS_RESOURCE_* triple.
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-platform-orchestrator` rather than
# qits-platform-orchestrator-service-<version>-runner, so `-Dnative` produces
# target/qits-platform-orchestrator and the process is identifiable in `ps` / `docker top`. The
# failsafe plugin's native.image.path in service/pom.xml spells the same name; the two are the same
# string in two files and move together.
quarkus.package.output-name=qits-platform-orchestrator
quarkus.package.jar.add-runner-suffix=false
