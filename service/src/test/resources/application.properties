# Test-only overrides. This module is the deployable, so its app-level settings live in
# src/main/resources/application.properties and Quarkus MERGES that file into the test config — it is
# not shadowed by this one. Never re-declare an app-level setting here: a test copy that drifts from
# the shipped copy makes the suite lie, passing on a value no deployment ever gets.

# A FREE port, not Quarkus' default test port 8081. Two reasons, and the first is not theoretical:
#   - on the deployment host 8081 is the address the platform's own npm registry is published on, so
#     on the one machine this service is most likely to be built on the default port is already
#     bound and the whole suite dies with "Port already bound: 8081", which reads like a code failure
#     and is not one;
#   - even where 8081 is free, @QuarkusTest restarts race each other for it.
# Failsafe passes the same value to the packaged artifact (service/pom.xml).
quarkus.http.test-port=0

# NO DEV SERVICES. A clone tests green with no docker, and a dev service is a container start:
# quarkus-oidc launches a real Keycloak whenever a profile leaves quarkus.oidc.auth-server-url unset,
# and an unnamed default datasource invites one of its own. Nothing here needs one: the datasource is
# an embedded postgres the suite starts itself, and the OIDC tenant is disabled because
# %test.qits.auth.machine.required is false in src/main/resources/application.properties.
quarkus.devservices.enabled=false

# THE CLOCK IS OFF IN THE SUITE. The gc schedule is a cron, so it would fire only at 03:00 — but a
# suite whose outcome depends on the wall clock is a suite that fails once a year for nobody's
# reason, and a scheduled run would start real HTTP calls out of a test JVM. Every test that wants a
# run starts one itself.
quarkus.scheduler.enabled=false

# The suite runs against an EMBEDDED POSTGRES — real binaries, spawned as a child process by zonky.
# Its port is chosen at run time, so the url/username/password are not written here at all:
# EmbeddedPgConfigSource supplies them at an ordinal above this file. clean-at-start wipes the schema
# between Quarkus restarts, which is what keeps a suite that shares one database across classes
# reproducible.
quarkus.flyway.orchestrator.clean-at-start=true

# The qits-eventstream jar's outbox and claim tables, on a database of their own (see
# testdb/EmbeddedPgConfigSource). `qits.eventstream.enabled=false` (shipped in main's copy under
# %test) stops publishing, sweeping and dialling — never the datasource — so this one is opened and
# migrated in every @QuarkusTest here whether the bus is used or not.
quarkus.flyway.eventstream.clean-at-start=true

# The catch-up sweeper pages qits-events for every durable listener at startup and on an interval.
# There is no qits-events in this suite, so a tick would be a failed HTTP call per listener per
# interval — noise at best, and a gc run nobody asked for if a stub is ever added. Off at startup and
# effectively never on a timer. (quarkus.scheduler.enabled=false above already stops the timer half;
# these two are the belt, and the startup sweep is not a scheduler tick at all.)
qits.eventstream.catchup-at-startup=false
qits.eventstream.catchup-interval=PT24H

# THE USERFLOWS CLASS ORDERER, INSTALLED THE ONE WAY QUARKUS PERMITS. quarkus-junit ships its own
# junit-platform.properties with a ClassOrderer that groups tests by @TestProfile (so a profile's
# application is not torn down under a class still running), and surefire HARD-FAILS if a local
# junit-platform.properties overrides it. The blessed seam is the secondary orderer, which breaks
# ties INSIDE a profile group — story classes sharing a profile still run in topological
# @UserflowPrecondition order, and the ordinary test classes (no story annotations) are untouched.
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1); do not enable parallel execution.
#
# It sits in this file rather than beside the one IT that uses it because there is nowhere else to
# put it — this is the module's test config, and failsafe reads the same one.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer
