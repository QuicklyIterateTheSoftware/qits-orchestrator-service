# What qits-platform-orchestrator declares about its own configuration.
#
# The deployer reads this file from the git host at the RELEASED TAG and POSTs it to
# qits-configuration before it schedules the deployment. qits-configuration parses it with its one
# strict parser (DeclarationParser): `keys` is the whole top level, and a key takes only type,
# default and description.
#
# WHY THIS FILE EXISTS. qits-configuration flags a stored entry `orphaned` only when the application
# has a declaration that does not list the key. Without this file nothing of this application is
# flagged, so its dead entries cannot be seen or removed from the configuration UI. Every key below
# is still read by this service. Any stored entry NOT listed here is one this service no longer
# reads, and a person may remove it (epic qits-540 dossier, 'Plan (as of 2026-09-13)', C9 and C10).
#
# THE LIST MUST BE COMPLETE. A key missing here is flagged orphaned while it is still needed, and the
# UI invites a person to delete it. Add a key here in the same commit that starts reading it.
#
# NO KEY HAS A DEFAULT. A default here is layered UNDER the stored entries, and on this platform the
# bootstrap stores all of them, so a default would be invisible. Nothing observable changes when this
# file lands (docs guide configuration-yml.md, section 7.5, step one). Peer addresses are plain
# `string`s, not `serviceAddress`: a serviceAddress is rendered by the platform and ignores the
# stored value, so declaring one would change what the container gets.
#
# DELIBERATELY NOT HERE, AND A PERSON MAY DELETE THESE STORED ENTRIES:
#   * QUARKUS_OIDC_CLIENT_ARTIFACTS_*, _CI_*, _CONTAINERS_*, _DEPLOYMENTS_*, _PROJECTS_* and
#     _WORKSPACES_* — six families, five keys each. No code mints through those names — one client,
#     `qits`, mints for every peer, reading the deployer's `idp:client` resource alone. They are not
#     inert while they are stored, though: quarkus-oidc-client discovers `quarkus.oidc-client.<name>`
#     map keys FROM THE ENVIRONMENT, so one variable of a family is enough to make the name a client
#     at runtime, and `client-enabled` / `discovery-enabled` both default to true. The image
#     therefore ships `client-enabled=false`, `discovery-enabled=false` and `token-path` for each of
#     those six names to keep them off the network at boot
#     (orchestrator/.../META-INF/microprofile-config.properties). DELETING THESE ENTRIES IS THE
#     PREREQUISITE FOR REMOVING THOSE LINES, in that order and a later change: the lines cannot go
#     while a deployment still sets _CLIENT_ENABLED=true for the name.
#   * QUARKUS_OIDC_CLIENT_QITS_CLIENT_ENABLED and _CREDENTIALS_SECRET. This is the env SPELLING of
#     the `qits` client's own dotted properties — the same `quarkus.oidc-client.qits.*` keys this
#     file's microprofile-config.properties ships — so a deployment that ever set one would SHADOW
#     the resource read: env is ordinal 300, the shipped `${QITS_RESOURCE_IDP_*:…}` expression is
#     250, and the environment variable wins outright rather than feeding the expression. Nothing on
#     this platform sets either today; declaring them here would invite a person to set a value that
#     silently overrides the deployer's own resource.
#   * QITS_AUTH_MACHINE_AUDIENCE. qits-auth-core's `MachineAuth` reads the platform audience from its
#     own shipped `qits.auth.machine.platform-audience`, qits-platform; no property of this
#     service's own stands between a deployment and that value, so a stored entry sets nothing.
#   * QITS_RESOURCE_*. The deployer injects those from its own resource registry, the single
#     authority for a provisioned credential. qits-configuration must not state or delete one.

keys:
  # --- the inbound guard ----------------------------------------------------------------------

  env.QITS_AUTH_MACHINE_REQUIRED:
    type: boolean
    description: "The machine gate. On, a bearer is validated against the idp; off, there is no OIDC tenant at all."

  env.QUARKUS_OIDC_AUTH_SERVER_URL:
    type: string
    description: "The issuer whose JWKS validates inbound tokens."

  # --- the nine peers a run calls --------------------------------------------------------------

  env.QITS_ORCHESTRATOR_TARGETS_ARTIFACTS_URL:
    type: string
    description: "Where qits-artifacts is: registry and blob gc. Scheme, host and port, no path."

  env.QITS_ORCHESTRATOR_TARGETS_CONTAINERS_URL:
    type: string
    description: "Where qits-containers is: host image, volume and build cache pruning. Scheme, host and port, no path."

  env.QITS_ORCHESTRATOR_TARGETS_CI_URL:
    type: string
    description: "Where qits-ci is: the image pins its pipelines hold. Scheme, host and port, no path."

  env.QITS_ORCHESTRATOR_TARGETS_DEPLOYMENTS_URL:
    type: string
    description: "Where qits-deployments is: the deployment pins. Scheme, host and port, no path."

  env.QITS_ORCHESTRATOR_TARGETS_PROJECTS_URL:
    type: string
    description: "Where qits-projects is. Scheme, host and port, no path."

  env.QITS_ORCHESTRATOR_TARGETS_WORKSPACES_URL:
    type: string
    description: "Where qits-workspaces is: the merged-branch sweep. Scheme, host and port, no path."

  env.QITS_ORCHESTRATOR_TARGETS_MAINTENANCE_URL:
    type: string
    description: "Where qits-platform-maintenance is: the dependency pins. Scheme, host and port, no path."

  env.QITS_ORCHESTRATOR_TARGETS_CONFIGURATION_URL:
    type: string
    description: "Where qits-configuration is: the configured image pins. Scheme, host and port, no path."

  env.QITS_ORCHESTRATOR_TARGETS_IDP_URL:
    type: string
    description: "Where qits-idp is: the unclaimed service-client sweep. Scheme, host and port, no path."

  # --- the gc policy ----------------------------------------------------------------------------

  env.QITS_ORCHESTRATOR_GC_ENABLED:
    type: boolean
    description: "Whether the clock may start a gc run."

  env.QITS_ORCHESTRATOR_GC_CRON:
    type: string
    description: "When the clock starts a gc run. A Quartz cron expression."

  env.QITS_ORCHESTRATOR_GC_TIME_ZONE:
    type: string
    description: "The zone the gc cron is read in."

  env.QITS_ORCHESTRATOR_GC_DRY_RUN:
    type: boolean
    description: "Whether the scheduled run only reports and deletes nothing."

  env.QITS_ORCHESTRATOR_GC_DEPLOY_TRIGGER_ENABLED:
    type: boolean
    description: "Whether a deployment going live starts a gc run."

  env.QITS_ORCHESTRATOR_GC_DEPLOY_TRIGGER_QUIET_PERIOD:
    type: string
    description: "How long after the last deployment of a wave that run fires. An ISO-8601 duration, such as PT10M."

  env.QITS_ORCHESTRATOR_GC_IMAGE_KEEP_PREFIXES:
    type: string
    description: "Comma-separated image tag prefixes no rule may condemn."

  env.QITS_ORCHESTRATOR_GC_BRANCH_KEEP_PREFIXES:
    type: string
    description: "Comma-separated branch prefixes the merged-branch sweep may never condemn."

  env.QITS_ORCHESTRATOR_GC_IMAGE_MIN_AGE:
    type: string
    description: "How old an image must be before a rule may condemn it. An ISO-8601 duration."

  env.QITS_ORCHESTRATOR_GC_VOLUME_MIN_AGE:
    type: string
    description: "How old a dangling volume must be before it is removed. An ISO-8601 duration."

  env.QITS_ORCHESTRATOR_GC_BUILD_CACHE_KEEP_BYTES:
    type: number
    description: "What the host buildkit cache may keep after a prune. Bytes."

  env.QITS_ORCHESTRATOR_GC_BUILDER_CACHE_KEEP_BYTES:
    type: number
    description: "What a buildx_buildkit builder container may keep after a prune. Bytes."

  env.QITS_ORCHESTRATOR_GC_CALL_TIMEOUT:
    type: string
    description: "How long one peer call may take. An ISO-8601 duration."

  # --- telemetry --------------------------------------------------------------------------------

  env.QITS_OBSERVABILITY_URL:
    type: string
    description: "Where this service's OTLP telemetry goes. Scheme, host and port, no path."

  # --- the event bus (qits-eventstream's own env, shipped as an ordinal-100 default) ------------

  env.QITS_EVENTS_URL:
    type: string
    description: "The event bus this service's outbox publishes through. Not set by the deployer today; the jar ships its own default."
