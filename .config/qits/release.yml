archetype: java-service
artifacts:
  - { type: docker, name: qits/qits-orchestrator, sbom: .sbom/sbom.json }
# THE PACTS (ticket qits-1149, epic qits-546): orchestrator/src/test/.../process/gc/GcContract
# binds every call the gc process makes to its eight peers to that peer's golden masters, and
# GcConsumerPactTest commits pacts/qits-orchestrator-service_<provider>.json. The platform packages
# each provider's file as eu.wohlben.qits:qits-orchestrator-service-pacts-<provider>, published
# only when that file changed.
# THE GOLDEN MASTERS (qits-1933): what this service's own API answers, one provider state per
# operation, recorded by service/.../contracts/GoldenMasterRecordingTest into `golden-masters/`. The
# platform packages it as `eu.wohlben.qits:qits-orchestrator-golden-masters` and
# `@qits/orchestrator-golden-masters`, each published only when its content changed — what
# qits-orchestrator-frontend, and the agents and the desk that start gc runs, pact against.
# THE PACTS (qits-1163): what qits-eventstream asks qits-events on qits-orchestrator's behalf (the
# durable listener's catch-up reads; it publishes nothing), flat in `pacts/` as
# `qits-orchestrator-service_qits-eventstream-javalib_qits-events-service.json`, written by
# contracts/eventstream/EventstreamPactTest from the library's kit. The platform packs it for
# qits-events-service, published only when it changed.
contracts:
  application: qits-orchestrator
  golden-masters: { from: golden-masters/, packages: [maven, npm] }
  pacts:
    qits-containers-service: { packages: [maven] }
    qits-artifacts-service: { packages: [maven] }
    qits-deployments-service: { packages: [maven] }
    qits-ci-service: { packages: [maven] }
    qits-maintenance-service: { packages: [maven] }
    qits-workspaces-service: { packages: [maven] }
    qits-projects-service: { packages: [maven] }
    qits-idp-service: { packages: [maven] }
    qits-events-service: { packages: [maven] }
# THE SITE IS SPELLED, AND IT NAMES THE COMPONENT. `true` derives it from the REPOSITORY name,
# which would put the retired tier modifier in a storage id and then MOVE that id the day the
# repository is renamed — a bundle's history stranded under a name nothing publishes to any
# more. Every other service on the estate already spells the component (@userflows/qits-ci,
# @userflows/qits-projects, @userflows/qits-observability); `true` survived only here, where the
# derived value happened to be tolerable. Spelled, the rename costs the bundle nothing.
userflows: qits-orchestrator
