# Orchestrator-context defaults, shipped from this library jar.
#
# Library jars ship defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's
# application.properties is ignored entirely — read by whichever app pulls the jar in, here the
# `service` module. Its own src/main/resources/application.properties sits at 250, `.env` at 295 and
# real environment variables at 300, so a deployment overrides any of these without a rebuild.
#
# This context owns its OWN named datasource + persistence unit + Flyway lineage: its own PostgreSQL
# database, never sharing another service's database or its migration history.
#
# WHERE THE DATABASE COMES FROM. `.config/qits/deployments.yml` carries `resources: postgresql:db`;
# qits-platform-deployments creates the role and the database (`qits_platform_orchestrator`, the
# default derivation from the application name) on the tier's postgres before the successor
# container starts, and injects
#
#     QITS_RESOURCE_DB_URL / QITS_RESOURCE_DB_USERNAME / QITS_RESOURCE_DB_PASSWORD
#
# into it. Those three names are the platform's GENERIC resource contract — nothing about them is
# orchestrator-specific, which is the point: the application maps them in its own shipped defaults
# and the deployer stays framework-agnostic.
#
# THE TRIPLE HAS NO DEFAULTS, AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming the missing
# variable, rather than opening some fallback store nobody meant. A run's record of what it deleted
# is the only account of a deletion that exists, so writing it into somebody else's database would
# be the worst failure this service could have.
quarkus.datasource.orchestrator.db-kind=postgresql
quarkus.datasource.orchestrator.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.orchestrator.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.orchestrator.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER, WHICH STOCK AGROAL DOES NOT. Replacing the tier's postgres
# severs every pooled connection; without validation the pool hands a dead one to the next caller
# long after the database is back, and 5s of acquisition is not enough for the successor to take the
# alias. Validate at borrow, and wait 15s before giving up.
#
# The driver is the third line of the platform's baseline. PatientPgDriver (qits-db-core) delegates
# to org.postgresql.Driver and, when the database is not there, keeps asking for up to 14s instead
# of failing at once; validate-on-borrow is what turns a dead pooled connection into the fresh
# creation attempt it can be patient about; the 15s acquisition timeout outlasts its deadline, so a
# caller that waits it out gets the database's real refusal rather than a generic pool message.
# `DatasourceBaselineTest` fails the build if a line goes missing.
quarkus.datasource.orchestrator.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.orchestrator.jdbc.acquisition-timeout=15S
quarkus.datasource.orchestrator.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to the orchestrator datasource, owning only this module's
# entities. `packages` assigns entity->PU unambiguously; without it an entity in a service with no
# DEFAULT datasource has no unit to belong to and the boot fails naming neither.
quarkus.hibernate-orm.orchestrator.datasource=orchestrator
quarkus.hibernate-orm.orchestrator.packages=eu.wohlben.qits.orchestrator.entity

# Own Flyway lineage at a classpath location named after the context, so it can never mix with
# another service's db/migration if the two ever share a jar or a database.
quarkus.flyway.orchestrator.migrate-at-start=true
quarkus.flyway.orchestrator.locations=classpath:db/orchestrator/migration

# --- where the peers are --------------------------------------------------------------------------
# A technical process is a sequence of REQUESTS, so an address is the one thing a process cannot
# derive — except that on THIS estate it can. Every application answers on qits-net at
# `<environment>-<application>`, unconditionally and for every service there is (qits-deployments'
# own alias derivation), and qits-deployments injects QITS_ENVIRONMENT into every container it
# starts. So an `<env>-<application>` alias plus a fixed port is not a decision a deployment makes,
# it is a SPELLING this process already holds both halves of — and a configuration entry carrying it
# is a second place for the same fact to be wrong. The `dev` fallback is this estate's environment,
# which is what every other default in this file already assumes. THE APPLICATION IS NOT RENAMED BY
# ANY OF THIS: qits-platform-maintenance keeps that name and becomes dev-qits-platform-maintenance,
# never dev-qits-maintenance.
#
# Eight peers, eight keys. Six of them — artifacts, containers, ci, deployments, projects,
# workspaces — are ordinary applications and qualify under their bare name. `deployments` and
# `configuration` are two of the nine platform applications and are spelled the way the platform
# names them: qits-deployments and qits-configuration carry no `-platform-` segment at all, while
# `maintenance` does (qits-platform-maintenance). Getting that wrong resolves nowhere rather than
# somewhere else — `deployments-url` shipped `http://qits-platform-deployments:8080` until this
# change, which is neither this application's bare name nor its qualified alias, so the default was
# never reachable and only ever worked because a live deployment's configuration entry overrode it.
qits.orchestrator.targets.artifacts-url=http://${QITS_ENVIRONMENT:dev}-qits-artifacts:8080
qits.orchestrator.targets.containers-url=http://${QITS_ENVIRONMENT:dev}-qits-containers:8080
qits.orchestrator.targets.ci-url=http://${QITS_ENVIRONMENT:dev}-qits-ci:8080
qits.orchestrator.targets.deployments-url=http://${QITS_ENVIRONMENT:dev}-qits-deployments:8080
qits.orchestrator.targets.projects-url=http://${QITS_ENVIRONMENT:dev}-qits-projects:8080
qits.orchestrator.targets.workspaces-url=http://${QITS_ENVIRONMENT:dev}-qits-workspaces:8080
# THE TWO PIN SOURCES A STORE-WIDE COLLECTION NEEDS AND THE OTHERS DO NOT NAME.
# qits-platform-maintenance answers what every repository's main still references — the maven, npm
# and docker versions written into its manifests — and qits-configuration answers the container
# images a workspace, editor or agent launch would pull. Neither is a deployment, so neither appears
# in the deployer's pin answer, and both are consumption a release-age rule cannot see.
qits.orchestrator.targets.maintenance-url=http://${QITS_ENVIRONMENT:dev}-qits-platform-maintenance:8080
qits.orchestrator.targets.configuration-url=http://${QITS_ENVIRONMENT:dev}-qits-configuration:8080

# --- the gc process -------------------------------------------------------------------------------
# WHAT KEEPS THE PLATFORM'S DISK FROM GROWING FOREVER. One run reads the pin set once, hands it to
# every deleter, and calls each owner's own deletion API. Nothing below decides what may be deleted:
# every rule lives with the store's owner. What lives here is the POLICY — how old is old enough,
# how much cache to keep, and what is never a candidate.
qits.orchestrator.gc.enabled=true

# 03:00 every day (user decision 2026-08-21), in qits.orchestrator.gc.time-zone. Off-hours because a
# run walks every image, every dangling volume and every registry identity on the platform. It ends
# well before qits-platform-mirror's own 03:20 eviction (a run measured about a minute live), so the
# two never read the same postgres at the same minute.
qits.orchestrator.gc.cron=0 0 3 * * ?
# The zone the cron is read in. UTC is the platform's convention — the mirror's sweep and every
# timestamp the UI shows are UTC — so "03:00" here is the same 03:00 an operator sees on a run row.
qits.orchestrator.gc.time-zone=UTC

# Whether the SCHEDULED run deletes anything. Shipped false — a manual run passes its own flag, so
# this key is only about the unattended one. A platform that wants to watch the figures for a week
# before letting the clock delete sets it to true and reads the runs in the UI.
qits.orchestrator.gc.dry-run=false

# --- the second way a run starts: a deployment ------------------------------------------------
# THE CRON IS A BACKSTOP, NOT THE POLICY. A deployment going live is the exact moment the images and
# registry identities it superseded stop being referenced by anything — and until 03:00 the next day
# they sat on the platform's disk with nothing to say so. `bus/DeploymentActiveListener` consumes
# qits-deployments' DeploymentActive and `schedule/GcDeployTrigger` turns it into a run.
#
# Whether deployments are a trigger at all. Beside qits.orchestrator.gc.enabled rather than folded
# into it: that key is whether an unattended run may happen, this one is whether a deployment is one
# of the things that cause one. Off, the listener still consumes and settles its events (a consumer
# that stopped claiming would owe every one of them forever) and simply arms nothing.
qits.orchestrator.gc.deploy-trigger.enabled=true

# THE TRAILING EDGE. A wave of deployments collapses into ONE run, fired this long after the LAST
# event of the wave rather than after the first — so the run drains everything the whole wave
# superseded in a single pass instead of racing a platform release that is still rolling.
#
# Ten minutes, and both directions of the choice are real. Shorter and a multi-application release
# starts a run its own later deployments immediately make stale; longer and the reclaim a person is
# waiting for after a deploy is not visibly connected to it. It is also comfortably longer than one
# application's own deploy takes, which is what makes a rolling release one wave and not two.
qits.orchestrator.gc.deploy-trigger.quiet-period=PT10M

# NEVER A CANDIDATE, WHATEVER ELSE THE RULES SAY. A prefix here is matched by qits-containers
# against a local tag's part after the first "/", so `qits/build-images/` covers every step image a
# pipeline launches and `qits/graalvmce-musl-builder` the native toolchain image. Both are pulled
# rarely and rebuilt expensively, and neither is named by a deployment pin — so without this line
# they are exactly what an age rule condemns first.
qits.orchestrator.gc.image-keep-prefixes=qits/build-images/,qits/graalvmce-musl-builder

# BRANCH PREFIXES THE SWEEP MAY NEVER CONDEMN, passed to qits-workspaces' merged-branch sweep. The
# sweep's own hard refusals — the main branch, environment/*, anything an active workspace stands
# on — live with the owner and cannot be configured away; what is listed here only widens them.
# The shipped value restates the deploy-ref protection (a collection key must not be empty), so a
# deployment that overrides this line cannot lose it by overriding; add prefixes beside it.
qits.orchestrator.gc.branch-keep-prefixes=environment/

# THE YOUNG-IMAGE GRACE, and it protects a build rather than a deployment. A CI step builds an image
# and pushes it seconds later; between those two moments the image is tagged, unreferenced by any
# row, and named by no pin. Six hours is comfortably longer than the longest native build on this
# platform.
qits.orchestrator.gc.image-min-age=PT6H

# A dangling volume younger than this is left alone: a container being recreated releases its volume
# for the seconds between `stop` and `start`, and a day is long enough that no deployment window
# reaches it.
qits.orchestrator.gc.volume-min-age=PT24H

# What buildkit may keep after a prune. TWO NUMBERS, because the two caches are not the same kind of
# thing. Bytes rather than a unit string, because both go straight into `--keep-storage`.
#
# THE HOST BUILDER is what every CI build warms and re-reads, so what is kept here is what the next
# build does not have to redo. 10 GiB, measured: the host cache sits at ~37 GB and 10 GB of warm
# cache covers the builds this platform actually runs. It was 20 GiB and that was a guess.
qits.orchestrator.gc.build-cache-keep-bytes=10737418240

# THE BOOTSTRAP BUILDER — a `buildx_buildkit_*` container — is a BOOTSTRAP-TIME cache. It is warmed
# once while a machine is being built and then nothing reads it until the next bootstrap, which is
# rare enough that re-fetching costs less than the disk. 1 GiB, so it is pruned to near-nothing
# rather than kept.
#
# One number for both is what left a 13.7 GB builder untouched every night: it is smaller than the
# host budget, so a shared keep-storage never reached it. qits-containers reads this as
# `builderKeepStorageBytes` and falls back to the host figure when the field is absent, so an older
# peer keeps today's behaviour.
qits.orchestrator.gc.builder-cache-keep-bytes=1073741824

# HOW LONG ONE STEP'S CALL MAY TAKE. It bounds the connect and the read of a single peer request,
# and it is generous on purpose: an artifacts sweep walks every blob file on the platform and a
# container image prune walks the whole local store. A step that outruns it is a FAILED step with
# the timeout as its error, not a run that hangs — the executor is single-threaded and everything
# else queues behind it.
qits.orchestrator.gc.call-timeout=PT120S

# tags.sweep ALONE gets a longer read timeout. It is qits-projects walking the whole repository
# catalogue and pushing a decommissioning commit per affected repository to GitHub — dozens of
# round trips to a third party rather than one store's own read or write — so the shared 120 s
# budget above would fail it most nights. 15 minutes is comfortably longer than that walk gets on
# the estate today; the connect timeout is still the shared one, since reaching qits-projects itself
# is no slower than any other peer.
qits.orchestrator.gc.tags-sweep-call-timeout=PT900S

# --- outbound machine credentials -----------------------------------------------------------------
# ONE named oidc client, `qits` (epic qits-540 dossier, 'Plan (as of 2026-09-13)', C4), carries the
# bearer this service presents to every one of its eight peers. Under the plan's open calling model a
# token is cut for the PLATFORM rather than for one receiver — qits-idp puts `qits-platform` on every
# token it mints and every peer accepts it — so one client and one audience serve all eight calls,
# and what this service may do at a peer is decided by its roles. PeerTokens injects this client
# alone.
#
# Its id, secret and idp address come from the deployer and nowhere else. .config/qits/deployments.yml
# declares `resources: idp:client`, so qits-deployments provisions this application's own qits-idp
# service client and injects QITS_RESOURCE_IDP_URL, QITS_RESOURCE_IDP_CLIENT_ID and
# QITS_RESOURCE_IDP_CLIENT_SECRET; this file reads those three and nothing else (the shipped defaults
# are the dev estate's dev-qits-idp alias, derived off QITS_ENVIRONMENT with the same `dev` fallback
# every other default in this file already assumes, and dev-qits-orchestrator). No configuration
# entry names any of the three, and the old QUARKUS_OIDC_CLIENT_ARTIFACTS_* fallback is gone.
quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:dev-qits-orchestrator}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}
quarkus.oidc-client.qits.grant.type=client
# One audience for every peer, the plan's ruling (epic qits-540 dossier, 'Plan (as of 2026-09-13)'):
# qits-platform. It is the only audience the idp mints and the one value every receiver's own
# quarkus.oidc.token.audience names.
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
quarkus.oidc-client.qits.early-tokens-acquisition=false
# On wherever the deployer runs it — every deployment has the resource, so there is no switch to
# flip. Off under %dev and %test, so a suite or a local run never dials an idp.
quarkus.oidc-client.qits.client-enabled=true
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false

# --- the one client block nothing injects -----------------------------------------------------------
# THE DEFAULT (UNNAMED) CLIENT IS DISABLED AND STAYS DISABLED. The extension creates it whether or
# not anything injects it, and an enabled client with no auth-server-url fails the boot naming a key
# nobody meant to set. No QUARKUS_OIDC_CLIENT_{CLIENT_ID,CREDENTIALS_SECRET,AUTH_SERVER_URL,
# CLIENT_ENABLED,GRANT_OPTIONS_CLIENT_AUDIENCE} entry is live on dev-qits-orchestrator today (its
# envKeys, read 2026-10-02), so this line may be pure dead weight — but a single `false` costs
# nothing to ship, while being wrong about "nothing ever mints this map key" costs a boot hazard, so
# it stays rather than being deleted on a guess.
quarkus.oidc-client.client-enabled=false

# --- six names the deployment still sets, neutralised -----------------------------------------------
# NOTHING MINTS THROUGH THESE AND THEY ARE NOT CLIENTS ANYBODY WANTS — `qits` mints for all eight
# peers. They are here because the deployed configuration of this application still carries
# QUARKUS_OIDC_CLIENT_ARTIFACTS_*, _CI_*, _CONTAINERS_*, _DEPLOYMENTS_*, _PROJECTS_* and
# _WORKSPACES_* entries (dev-qits-orchestrator's envKeys, read 2026-10-02; no
# QUARKUS_OIDC_CLIENT_QITS_* among them), and ONE variable of a family is enough: SmallRye discovers
# `quarkus.oidc-client.<name>` MAP KEYS from the environment source, so the name exists at runtime
# whether or not this file declares a block for it. A name with no block behind it answers the
# extension's own defaults, and both defaults are ON — `client-enabled` is true, `discovery-enabled`
# is true. An enabled, discovering client is built during RUNTIME INIT, before the HTTP listener
# accepts: OidcClientRecorder.createOidcClient blocks on metadata discovery for `connection-timeout`
# (10 s) per client, serially. An issuer that accepts the connection and does not answer — a proxy in
# front of a still-starting idp, a wedged idp — therefore FAILS THE BOOT of this service over clients
# it never calls.
#
# ALL THREE KEYS ARE LOAD-BEARING. `client-enabled=false` short-circuits to a DisabledOidcClient
# before discovery, but this file sits BELOW the environment: the deployment's _CLIENT_ENABLED=true
# overrides it, so on its own it neutralises nothing where it matters. `discovery-enabled=false` is
# the key no deployment sets, and it is what makes an enabled client take its token endpoint from
# configuration instead of the network. It cannot stand alone either: with discovery off and no
# token path the recorder has no endpoint to build and throws a ConfigurationException that fails
# the boot outright. `token-path` supplies it, against the `_AUTH_SERVER_URL` each family sets.
# Together the three are inert under every subset of those variables — the whole family set, some of
# it, or none of it, in which case nothing is built at all. `artifacts` was the block the `qits`
# client's fallback used to read; it carries no special keys any more and is neutralised exactly like
# its five siblings.
#
# THESE LINES GO once no QUARKUS_OIDC_CLIENT_<NAME>_* variable reaches the container any more — the
# config GC deletes the retired entries and the deployer's extras file stops stating them (qits-375:
# a deleted entry still reaches the container while that file names it) — and not one release
# before: with no variable there is no map key, no client and nothing left to neutralise.
quarkus.oidc-client.artifacts.client-enabled=false
quarkus.oidc-client.artifacts.discovery-enabled=false
quarkus.oidc-client.artifacts.token-path=token

quarkus.oidc-client.ci.client-enabled=false
quarkus.oidc-client.ci.discovery-enabled=false
quarkus.oidc-client.ci.token-path=token

quarkus.oidc-client.containers.client-enabled=false
quarkus.oidc-client.containers.discovery-enabled=false
quarkus.oidc-client.containers.token-path=token

quarkus.oidc-client.deployments.client-enabled=false
quarkus.oidc-client.deployments.discovery-enabled=false
quarkus.oidc-client.deployments.token-path=token

quarkus.oidc-client.projects.client-enabled=false
quarkus.oidc-client.projects.discovery-enabled=false
quarkus.oidc-client.projects.token-path=token

quarkus.oidc-client.workspaces.client-enabled=false
quarkus.oidc-client.workspaces.discovery-enabled=false
quarkus.oidc-client.workspaces.token-path=token

# THERE IS NO CLIENT FOR qits-platform-maintenance OR qits-configuration, and none is needed: no
# QUARKUS_OIDC_CLIENT_MAINTENANCE_* or _CONFIGURATION_* entry exists on the deployment, so no map
# key is minted for either name and there is nothing to neutralise. Those two are reached with the
# same `qits` bearer as the other six.
