paths:
  /orchestrator/api/artifacts/repositories:
    get:
      summary: "Every artifacts repository, with what a collection would reclaim"
      description: Reads the platform's pins and hands them to qits-artifacts' POST
        /artifacts/api/gc/repositories; its answer is returned verbatim.
      operationId: listArtifactsCleanupRepositories
      responses:
        "200":
          description: qits-artifacts' repository listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcRepositoriesPlanResponse"
        "502":
          description: qits-artifacts could not be asked
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Artifacts Cleanup Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:system
        - qits:agent
  /orchestrator/api/artifacts/repositories/{repository}/plan:
    get:
      summary: One artifacts repository's collection plan; nothing is deleted
      description: "Reads the platform's pins and hands them to qits-artifacts' POST\
        \ /artifacts/api/gc/repositories/{repository}/plan; its answer is returned\
        \ verbatim."
      operationId: planArtifactsCleanupRepository
      parameters:
      - name: repository
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: qits-artifacts' plan for the repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcRepositoryPlanReport"
        "404":
          description: qits-artifacts has no such repository
        "502":
          description: qits-artifacts could not be asked
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Artifacts Cleanup Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:system
        - qits:agent
  /orchestrator/api/artifacts/repositories/{repository}/sweep:
    post:
      summary: Sweep one artifacts repository
      description: "Reads the platform's pins and hands them to qits-artifacts' POST\
        \ /artifacts/api/gc/repositories/{repository}/sweep; its receipt is returned\
        \ verbatim. Refused while a gc run is active, and no gc run starts while it\
        \ is in flight."
      operationId: sweepArtifactsCleanupRepository
      parameters:
      - name: repository
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: qits-artifacts' sweep receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcRepositorySweepReport"
        "404":
          description: qits-artifacts has no such repository
        "409":
          description: A gc run is active
        "502":
          description: qits-artifacts could not be asked
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Artifacts Cleanup Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:system
        - qits:agent
  /orchestrator/api/processes:
